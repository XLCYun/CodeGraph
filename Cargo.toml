[package]
name = "codegraph"
version = "0.1.0"
description = "Standalone multi-language Code Graph engine"
license = "Apache-2.0"
edition = "2021"
publish = false

[dependencies]
dunce = "=1.0.5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_Console", "Win32_System_Pipes"] }
