[package]
name = "codegraph-public-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
libc = "=0.2.191"
tokio = { version = "=1.53.3", features = ["process"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_SystemServices"] }
